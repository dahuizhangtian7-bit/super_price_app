services:
  - type: web
    name: super-price-app
    env: docker
    plan: free
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: super-price-db
          property: connectionString

databases:
  - name: super-price-db
    databaseName: super_price_app_production
    plan: free
